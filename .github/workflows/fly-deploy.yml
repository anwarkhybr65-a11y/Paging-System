# PocketBase on Fly.io must not redeploy on every git push.
# A default fly deploy can create extra machines without the data volume,
# which makes staff login fail. Deploy only when you run this workflow manually.
name: Fly Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy PocketBase
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
